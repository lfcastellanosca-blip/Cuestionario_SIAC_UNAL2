<?xml version="1.0" encoding="UTF-8"?>
<!--
  =============================================================================
  RETO SIAC — Portada para compartir (Open Graph / redes)   1200 x 630 px
  Universidad Nacional de Colombia · Educación de Calidad: UN Bien Común

  QUÉ HAY QUE AJUSTAR ANTES DE PUBLICAR
  
  1) COLOR. El verde de abajo (#12472C) es un marcador de posición. El valor
     oficial del verde institucional está en la guía de identidad visual:
     https://identidad.unal.edu.co  →  B1 Elementos de identidad visual.
     Reemplácelo en la variable de color y en el rectángulo de fondo.

  2) ESCUDO. Este archivo NO incluye el escudo ni el logosímbolo: son marcas
     registradas ante la SIC y su uso requiere aval de la Oficina de Medios
     Digitales (Unimedios). Solicítelos por la página de solicitudes de
     Unimedios y colóquelos en el grupo marcado ZONA-ESCUDO, abajo a la
     derecha. Sobre fondo de color plano corresponde la versión monocromática
     blanca; la versión en verde solo va sobre fondo blanco.

  3) TIPOGRAFÍA. La familia institucional es Ancízar. Aquí se usa una serif
     genérica como sustituto. Si tiene Ancízar instalada, cambie
     font-family="Georgia, serif" por font-family="Ancizar, Georgia, serif"
     en los textos de titular y bajada.

  4) URL. Reemplace reto-siac.unal.edu.co por la dirección real de publicación.

  Para exportar a PNG: abra en Inkscape o Illustrator y exporte a 1200x630.
  =============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root{ --verde:#12472C; }            /* ← 1) color institucional */
    .fondo   { fill:#12472C; }           /* ← mismo valor que --verde */
    .claro   { fill:#96BAA4; }
    .blanco  { fill:#FCFCFA; }
    .filete  { stroke:#96BAA4; stroke-width:2; }
    .rule    { stroke:#387052; stroke-width:1; }
    .aro     { fill:none; stroke:#FCFCFA; stroke-width:3; }
    .mono    { font-family:"DejaVu Sans Mono", Consolas, monospace; }
    .serif   { font-family:Georgia, "Times New Roman", serif; }
    .sans    { font-family:system-ui, "Segoe UI", Arial, sans-serif; }
  </style>

  <rect class="fondo" width="1200" height="630"/>

  <!-- Encabezado -->
  <text class="mono claro" x="74" y="78" font-size="15" letter-spacing="3">UNIVERSIDAD NACIONAL DE COLOMBIA</text>
  <text class="serif claro" x="74" y="112" font-size="20">Educación de Calidad: UN Bien Común</text>

  <!-- Titular -->
  <text class="serif blanco" x="70" y="240" font-size="76">Reto</text>
  <text class="serif blanco" x="68" y="390" font-size="150" font-weight="bold">SIAC</text>

  <line class="filete" x1="74" y1="432" x2="264" y2="432"/>

  <!-- Bajada -->
  <text class="sans claro" x="74" y="474" font-size="24">24 preguntas sobre cómo la Universidad cuida,</text>
  <text class="sans claro" x="74" y="506" font-size="24">evalúa y mejora la calidad de lo que hace.</text>
  <text class="mono claro" x="74" y="542" font-size="13" letter-spacing="2.2">10 MINUTOS  ·  UN RECONOCIMIENTO CON TU NOMBRE</text>

  <!-- Sellos de nivel -->
  <g>
    <circle class="aro" cx="822" cy="292" r="52"/>
    <text class="serif blanco" x="822" y="303" font-size="38" text-anchor="middle">I</text>
    <text class="mono claro" x="822" y="329" font-size="11" text-anchor="middle" letter-spacing="2">NIVEL</text>

    <circle class="aro" cx="948" cy="292" r="52"/>
    <text class="serif blanco" x="948" y="303" font-size="38" text-anchor="middle">II</text>
    <text class="mono claro" x="948" y="329" font-size="11" text-anchor="middle" letter-spacing="2">NIVEL</text>

    <circle class="aro" cx="1074" cy="292" r="52"/>
    <text class="serif blanco" x="1074" y="301" font-size="30" text-anchor="middle">III</text>
    <text class="mono claro" x="1074" y="329" font-size="11" text-anchor="middle" letter-spacing="2">NIVEL</text>
  </g>

  <!-- Pie -->
  <line class="rule" x1="74" y1="566" x2="1126" y2="566"/>
  <text class="mono claro" x="74" y="598" font-size="13" letter-spacing="2.4">RETO-SIAC.UNAL.EDU.CO</text>

  <!-- =========================================================================
       ZONA-ESCUDO
       Coloque aquí el escudo o el logosímbolo institucional, en su versión
       monocromática blanca. Área disponible: x 940–1126, y 574–614 (186x40 px).
       Alinee el borde derecho del escudo con x=1126 para que quede a plomo con
       el filete superior. Borre este comentario y el rectángulo guía al montar.
       ========================================================================= -->
  <g id="ZONA-ESCUDO">
    <rect x="940" y="574" width="186" height="40" fill="none" stroke="#387052"
          stroke-width="1" stroke-dasharray="4 4"/>
    <text class="mono" x="1033" y="598" font-size="9" fill="#387052"
          text-anchor="middle" letter-spacing="1.4">ESCUDO INSTITUCIONAL</text>
  </g>
</svg>
